<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Esboços de Pregação</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    --bg:#F7F4ED;
    --surface:#FFFFFF;
    --ink:#2A2420;
    --ink-soft:#6B6052;
    --primary:#3B3486;
    --primary-dark:#2A2563;
    --primary-soft:#E8E6F4;
    --gold:#B8862D;
    --gold-soft:#F7EDD9;
    --danger:#B3432B;
    --danger-soft:#F8E7E1;
    --border:#E3DECF;
    --ghost:#fff;
    --radius:10px;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'SF Mono', 'Consolas', 'Courier New', monospace;
    --m-size:15px;
    --m-ink:var(--ink);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body); background:var(--bg); color:var(--ink); min-height:100vh; -webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0 0 4px;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  header.topbar{background:var(--primary-dark); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  header.topbar .brand .tag{font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#C9C4E6;}
  header.topbar .brand h1{font-size:18px; color:#fff;}

  nav.tabs{display:flex; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; position:sticky; top:0; z-index:5;}
  nav.tabs button{flex:1; min-width:100px; background:none; border:none; padding:12px 8px; font-size:12.5px; color:var(--ink-soft); font-weight:600; border-bottom:3px solid transparent; white-space:nowrap;}
  nav.tabs button.active{color:var(--primary); border-bottom-color:var(--primary);}
  nav.tabs button:hover{background:var(--primary-soft);}

  main{flex:1; padding:20px; max-width:860px; margin:0 auto; width:100%;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .page-head h2{font-size:22px;}
  .page-head .sub{color:var(--ink-soft); font-size:13px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .empty{padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:14px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:8px; padding:11px 18px; font-size:14px; font-weight:600; background:var(--primary); color:#fff; width:100%;}
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:var(--surface); color:var(--primary); border:1px solid var(--primary);}
  .btn.secondary:hover{background:var(--primary-soft);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#8f341f;}
  .btn.ghost{background:var(--ghost); color:var(--ink-soft); border:1px solid var(--border);}
  .btn.small{padding:6px 18px; font-size:13px; width:auto;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:15px; background:#FCFBF8; color:var(--ink);}
  .field textarea{resize:vertical; min-height:70px; font-family:var(--font-body); line-height:1.5;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:520px){ .row2{grid-template-columns:1fr;} }

  .toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .search-box{flex:1; min-width:160px;}
  .search-box input{width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px;}

  .esboco-card{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;}
  .esboco-card .meta{display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:var(--ink-soft); font-size:12.5px; margin:4px 0 10px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700; background:var(--gold-soft); color:var(--gold);}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}

  .ponto-card, .link-card{background:#FCFBF8; border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px; position:relative;}
  .ponto-card .ponto-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .ponto-card .ponto-num{font-family:var(--font-display); font-weight:700; color:var(--primary);}
  .remove-x{background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer; line-height:1;}
  .link-card .ponto-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .link-card .ponto-num{font-family:var(--font-display); font-weight:700; color:var(--primary);}
  .inline-row{display:flex; gap:8px;}
  .inline-row input{flex:1; min-width:0;}
  a.verse{color:var(--primary); text-decoration:underline;}

  .error-msg{background:var(--danger-soft); color:var(--danger); padding:9px 12px; border-radius:8px; font-size:13px; margin-bottom:14px;}
  .ok-msg{background:var(--primary-soft); color:var(--primary-dark); padding:9px 12px; border-radius:8px; font-size:13px; margin-bottom:14px;}

  .overlay{position:fixed; inset:0; background:rgba(20,16,10,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50;}
  .modal{background:var(--surface); border-radius:14px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto; padding:24px;}
  .modal h3{font-size:19px; margin-bottom:16px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{width:auto; flex:1;}

  /* Popup de visualização em tela cheia (largura total) */
  .overlay.overlay-full{padding:8px; align-items:stretch;}
  .modal.modal-full{max-width:none; max-height:100%; padding:16px;}
  .modal-full .manuscrito{max-width:none; margin:0; padding:30px clamp(16px,4vw,48px);}
  .modal-full .modal-actions{max-width:none; margin:16px 0 0;}

  /* ---------- Manuscrito para impressão/visualização ---------- */
  .manuscrito{background:#FFFDF8; border:1px solid var(--border); border-radius:var(--radius); padding:30px 28px; max-width:680px; margin:0 auto; font-size:var(--m-size); color:var(--m-ink);}
  .manuscrito .m-tema{font-family:var(--font-mono); font-size:.73em; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
  .manuscrito h1{font-size:1.73em; color:var(--m-ink); margin-bottom:4px;}
  .manuscrito .m-base{font-style:italic; color:var(--ink-soft); font-size:.93em; margin-bottom:4px;}
  .manuscrito .m-data{font-size:.83em; color:var(--ink-soft); margin-bottom:18px; border-bottom:1px dashed var(--border); padding-bottom:16px;}
  .manuscrito h3.m-sec{font-size:.87em; text-transform:uppercase; letter-spacing:.08em; color:var(--primary); margin:20px 0 8px;}
  .manuscrito p{line-height:1.65; font-size:1em; margin:0 0 10px; white-space:pre-wrap;}
  .manuscrito .m-ponto{margin-bottom:14px;}
  .manuscrito .m-ponto .m-ponto-titulo{font-weight:700; font-size:1.03em;}
  .manuscrito .m-ponto .m-ponto-vers{font-style:italic; color:var(--gold); font-size:.87em; margin:2px 0 4px;}

  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

  /* Estilo por tópico (cor, negrito, itálico) — variáveis definidas em Configurações */
  .manuscrito .s-titulo{color:var(--s-titulo-c,var(--m-ink)); font-weight:var(--s-titulo-w,700); font-style:var(--s-titulo-i,normal);}
  .manuscrito .s-base{color:var(--s-base-c,var(--ink-soft)); font-weight:var(--s-base-w,400); font-style:var(--s-base-i,italic);}
  .manuscrito .s-base a.verse{color:var(--s-base-c,var(--primary));}
  .manuscrito h3.m-sec.s-secao{color:var(--s-secao-c,var(--primary)); font-weight:var(--s-secao-w,700); font-style:var(--s-secao-i,normal);}
  .manuscrito .m-ponto-aplic-label{font-size:.8em; text-transform:uppercase; letter-spacing:.08em; margin:10px 0 4px; color:var(--s-secao-c,var(--primary)); font-weight:var(--s-secao-w,700); font-style:var(--s-secao-i,normal);}
  .manuscrito .s-resumo{color:var(--s-resumo-c,inherit); font-weight:var(--s-resumo-w,inherit); font-style:var(--s-resumo-i,normal);}
  .manuscrito .s-intro{color:var(--s-intro-c,inherit); font-weight:var(--s-intro-w,inherit); font-style:var(--s-intro-i,normal);}
  .manuscrito .s-ptitulo{color:var(--s-ptitulo-c,inherit); font-weight:var(--s-ptitulo-w,700); font-style:var(--s-ptitulo-i,normal);}
  .manuscrito .m-ponto .s-vers{color:var(--s-vers-c,var(--gold)); font-weight:var(--s-vers-w,400); font-style:var(--s-vers-i,italic);}
  .manuscrito .s-vers a.verse{color:var(--s-vers-c,var(--primary));}
  .manuscrito .s-ptexto{color:var(--s-ptexto-c,inherit); font-weight:var(--s-ptexto-w,inherit); font-style:var(--s-ptexto-i,normal);}
  .manuscrito .s-perg{color:var(--s-perg-c,inherit); font-weight:var(--s-perg-w,400); font-style:var(--s-perg-i,italic);}
  .manuscrito .m-perg{margin:8px 0; padding:6px 10px; border-left:3px solid var(--primary-soft); line-height:1.55; white-space:pre-wrap;}
  .manuscrito .m-perg-rot{font-style:normal; font-weight:700; font-size:.8em; text-transform:uppercase; letter-spacing:.08em; color:var(--s-secao-c,var(--primary)); margin-right:4px;}
  .manuscrito .s-aplic{color:var(--s-aplic-c,inherit); font-weight:var(--s-aplic-w,inherit); font-style:var(--s-aplic-i,normal);}
  .manuscrito .s-concl{color:var(--s-concl-c,inherit); font-weight:var(--s-concl-w,inherit); font-style:var(--s-concl-i,normal);}
  .manuscrito .s-obs{color:var(--s-obs-c,inherit); font-weight:var(--s-obs-w,inherit); font-style:var(--s-obs-i,normal);}
  .est-row{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border);}
  .est-row:last-of-type{border-bottom:none;}
  .est-nome{flex:1; font-size:14px; min-width:0;}
  .est-btn{width:34px; height:34px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--ink); font-size:15px; padding:0; flex:none;}
  .est-btn.on{background:var(--primary); color:#fff; border-color:var(--primary);}

  /* Acesso rápido às cores na tela de edição */
  .est-atalho{border:1px solid var(--border); background:#fff; border-radius:8px; padding:2px 8px; font-size:14px; line-height:1.4;}
  .estilo-pop{position:fixed; left:8px; right:8px; bottom:8px; max-width:520px; margin:0 auto; z-index:9998; background:#fff; border:1px solid var(--border); border-left:4px solid var(--primary); border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.22); padding:10px 14px 12px; max-height:60vh; overflow:auto;}
  .estilo-pop .ep-head{display:flex; align-items:center; gap:8px; margin-bottom:4px; position:sticky; top:0; background:#fff;}
  .estilo-pop .ep-head strong{flex:1;}
  .estilo-pop .ep-x{border:none; background:none; font-size:18px; color:var(--ink-soft); padding:2px 6px;}
  @media print{ .estilo-pop{display:none !important;} }
  #ed-titulo{color:var(--s-titulo-c,inherit); font-weight:var(--s-titulo-w,inherit); font-style:var(--s-titulo-i,inherit);}
  #ed-base{color:var(--s-base-c,inherit); font-weight:var(--s-base-w,inherit); font-style:var(--s-base-i,inherit);}
  #ed-resumo{color:var(--s-resumo-c,inherit); font-weight:var(--s-resumo-w,inherit); font-style:var(--s-resumo-i,inherit);}
  #ed-introducao{color:var(--s-intro-c,inherit); font-weight:var(--s-intro-w,inherit); font-style:var(--s-intro-i,inherit);}
  #ed-conclusao{color:var(--s-concl-c,inherit); font-weight:var(--s-concl-w,inherit); font-style:var(--s-concl-i,inherit);}
  #ed-observacoes{color:var(--s-obs-c,inherit); font-weight:var(--s-obs-w,inherit); font-style:var(--s-obs-i,inherit);}
  #ed-aplicacao, .ponto-card .ponto-aplicacao{color:var(--s-aplic-c,inherit); font-weight:var(--s-aplic-w,inherit); font-style:var(--s-aplic-i,inherit);}
  .ponto-card .ponto-titulo{color:var(--s-ptitulo-c,inherit); font-weight:var(--s-ptitulo-w,inherit); font-style:var(--s-ptitulo-i,inherit);}
  .ponto-card .ponto-versiculo{color:var(--s-vers-c,inherit); font-weight:var(--s-vers-w,inherit); font-style:var(--s-vers-i,inherit);}
  .ponto-card .ponto-texto{color:var(--s-ptexto-c,inherit); font-weight:var(--s-ptexto-w,inherit); font-style:var(--s-ptexto-i,inherit);}
  .ponto-card .ponto-perg-antes, .ponto-card .ponto-perg-depois1, .ponto-card .ponto-perg-depois2{color:var(--s-perg-c,inherit); font-weight:var(--s-perg-w,inherit); font-style:var(--s-perg-i,inherit);}

  /* Texto dos versículos */
  .manuscrito .ref{background:#F6EBC8; border-bottom:1px dotted var(--gold); border-radius:3px; padding:0 2px; cursor:pointer;}
  .manuscrito .ref:focus{outline:2px solid var(--primary-soft);}
  .manuscrito .ref-inline{font-style:italic; color:var(--ink-soft); background:#FBF6E9; border-radius:3px; padding:0 3px;}
  .manuscrito .m-vtexto{margin:6px 0 10px; padding:8px 12px; border-left:3px solid var(--gold); background:#FBF6E9; border-radius:0 8px 8px 0; font-size:.93em; line-height:1.55; color:var(--ink);}
  .manuscrito .m-vsig, .vp-ver{font-family:var(--font-mono); font-size:.75em; letter-spacing:.06em; color:var(--gold);}
  .manuscrito .m-vfalha{color:var(--ink-soft); font-style:italic;}
  .vprev{font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin-top:6px;}
  .vprev:empty{display:none;}
  .verse-pop{position:fixed; left:8px; right:8px; bottom:8px; max-width:640px; margin:0 auto; z-index:9999; background:#fff; border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:10px; box-shadow:0 8px 28px rgba(0,0,0,.22); padding:12px 14px; max-height:45vh; overflow:auto; font-size:15px; line-height:1.55;}
  .verse-pop .vp-head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .verse-pop .vp-head strong{flex:1;}
  .verse-pop .vp-x{border:none; background:none; font-size:18px; color:var(--ink-soft); padding:2px 6px;}
  @media print{ .verse-pop{display:none !important;} }

  /* Configurações: pré-visualização e cores */
  .swatches{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .swatch{width:34px; height:34px; border-radius:50%; border:2px solid var(--border); padding:0;}
  .swatch.sel{border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft);}
  input[type=color].cor-livre{width:44px; height:34px; padding:2px; border:1px solid var(--border); border-radius:8px; background:#fff;}
  input[type=range].tam{width:100%; accent-color:var(--primary);}
  .tam-row{display:flex; align-items:center; gap:10px;}
  .tam-row .btn{width:auto; padding:4px 12px;}
  .preview-box{margin-top:14px; border:1px dashed var(--border); border-radius:8px; padding:14px; background:#FFFDF8; font-size:var(--m-size); color:var(--m-ink); line-height:1.5;}

  @media print{
    header.topbar, nav.tabs, .no-print{display:none !important;}
    body{background:#fff;}
    main{padding:0; max-width:100%;}
    .manuscrito{border:none; box-shadow:none; padding:0;}
  }
  @media (min-width:720px){ nav.tabs button{flex:none; padding:12px 20px;} }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ CAMADA DE DADOS (localStorage) ============ */
const DB = {
  getEsbocos(){ return JSON.parse(localStorage.getItem('ep_esbocos')||'[]'); },
  setEsbocos(l){ localStorage.setItem('ep_esbocos', JSON.stringify(l)); }
};
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* Modelo usado na geração por IA (troque aqui se quiser outro) */
const MODELO_IA = 'claude-sonnet-5-5';
function getCfg(){ return JSON.parse(localStorage.getItem('ep_cfg')||'{}'); }
function setCfg(c){ localStorage.setItem('ep_cfg', JSON.stringify(c)); }
const FONTE_PADRAO={tam:15, cor:'#2A2420'};
/* Tópicos da visualização que podem ter estilo próprio (c = cor padrão; null = segue a cor geral) */
const ESTILOS={
  titulo:{n:'Título da pregação', c:null, b:true, i:false},
  base:{n:'Texto-base', c:'#6B6052', b:false, i:true},
  secao:{n:'Títulos das seções', c:'#3B3486', b:true, i:false},
  resumo:{n:'Resumo do conteúdo', c:null, b:false, i:false},
  intro:{n:'Introdução', c:null, b:false, i:false},
  ptitulo:{n:'Título dos pontos', c:null, b:true, i:false},
  vers:{n:'Versículo de apoio', c:'#3B3486', b:false, i:true},
  ptexto:{n:'Desenvolvimento dos pontos', c:null, b:false, i:false},
  aplic:{n:'Aplicação prática', c:null, b:false, i:false},
  perg:{n:'Perguntas', c:null, b:false, i:true},
  concl:{n:'Conclusão', c:null, b:false, i:false},
  obs:{n:'Observações', c:null, b:false, i:false}
};
function estEfetivo(k){
  const d=ESTILOS[k], e=(getCfg().estilos||{})[k]||{};
  return { c:e.c||d.c||(getCfg().fonteCor||FONTE_PADRAO.cor), b:e.b!==undefined?e.b:d.b, i:e.i!==undefined?e.i:d.i };
}
function setEstilo(k, patch){
  const c=getCfg(); c.estilos=c.estilos||{};
  if(patch===null) delete c.estilos[k]; else c.estilos[k]={...(c.estilos[k]||{}), ...patch};
  if(c.estilos[k] && !Object.keys(c.estilos[k]).length) delete c.estilos[k];
  setCfg(c); aplicarVisualizacao();
}
function linhaEstilo(k){
  const e=estEfetivo(k);
  return `<div class="est-row" data-est="${k}">
    <span class="est-nome" style="color:${e.c}; font-weight:${e.b?700:400}; font-style:${e.i?'italic':'normal'};">${ESTILOS[k].n}</span>
    <input type="color" class="cor-livre est-cor" value="${e.c}" title="Cor">
    <button type="button" class="est-btn est-b ${e.b?'on':''}" title="Negrito" aria-label="Negrito"><b>N</b></button>
    <button type="button" class="est-btn est-i ${e.i?'on':''}" title="Itálico" aria-label="Itálico"><i>I</i></button>
    <button type="button" class="est-btn est-reset" title="Restaurar este tópico" aria-label="Restaurar">↺</button>
  </div>`;
}
function atualizarLinhaEstilo(row){
  const k=row.dataset.est, e=estEfetivo(k);
  const nome=row.querySelector('.est-nome');
  nome.style.color=e.c; nome.style.fontWeight=e.b?700:400; nome.style.fontStyle=e.i?'italic':'normal';
  row.querySelector('.est-cor').value=e.c;
  row.querySelector('.est-b').classList.toggle('on',e.b);
  row.querySelector('.est-i').classList.toggle('on',e.i);
}
function bindLinhasEstilo(raiz){
  raiz.querySelectorAll('.est-row').forEach(row=>{
    const k=row.dataset.est;
    row.querySelector('.est-cor').addEventListener('input', e=>{ setEstilo(k,{c:e.target.value}); atualizarLinhaEstilo(row); });
    row.querySelector('.est-b').addEventListener('click', ()=>{ setEstilo(k,{b:!estEfetivo(k).b}); atualizarLinhaEstilo(row); });
    row.querySelector('.est-i').addEventListener('click', ()=>{ setEstilo(k,{i:!estEfetivo(k).i}); atualizarLinhaEstilo(row); });
    row.querySelector('.est-reset').addEventListener('click', ()=>{ setEstilo(k,null); atualizarLinhaEstilo(row); });
  });
}
/* Painel rápido de cores/estilo, aberto direto da tela de edição */
function abrirPainelEstilos(chaves, titulo){
  const antigo=document.getElementById('estilo-pop'); if(antigo) antigo.remove();
  const el=document.createElement('div');
  el.id='estilo-pop'; el.className='estilo-pop no-print';
  el.innerHTML='<div class="ep-head"><strong>'+escapeHtml(titulo)+'</strong><button type="button" class="ep-x" aria-label="Fechar">✕</button></div>'
    +chaves.map(linhaEstilo).join('')
    +'<div class="hint">Vale para todos os esboços. O texto dos campos muda de cor enquanto você escolhe.</div>';
  document.body.appendChild(el);
  bindLinhasEstilo(el);
  el.querySelector('.ep-x').addEventListener('click', ()=>el.remove());
}
function aplicarVisualizacao(){
  const c=getCfg(), r=document.documentElement.style;

function bibleUrl(ref){

  if(siteBusca()==='bibliaonline'){
    const slugV = v==='NVI-PT' ? 'nvi' : v.toLowerCase();

      if(r.ini) u+='/'+r.ini+(r.fim?'-'+r.fim:'');
      return u;
    }
    return 'https://www.bibliaonline.com.br/'+slugV+'/busca?q='+encodeURIComponent(ref);
  }
  if(siteBusca()==='openbible'){
    const base='https://thiagobodruk.github.io/open-bible/';

      if(r.ini) u+='/'+r.ini+(r.fim?'-'+r.fim:'');
      return u;
    }
    return base;
  }
  return 'https://www.biblegateway.com/passage/?search='+encodeURIComponent(ref)+'&version='+encodeURIComponent(v);
}

function normLivro(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[ºª°.\s]/g,'').replace(/^primeir[oa]/,'1').replace(/^segund[oa]/,'2').replace(/^terceir[oa]/,'3');
}
const LIVROS_LISTA = LIVROS_TXT.split('\n').map(l=>l.split('|')[0]);
function indiceLivro(nome){ return LIVROS_LISTA.indexOf(nome); }
const SLUGS_BO = {};
const LIVROS_MAP = (()=>{
  const m={};
  const linhas=LIVROS_TXT.split('\n').map(l=>l.split('|'));
  linhas.forEach(([nome])=>{ m[normLivro(nome)]=nome; });
  linhas.forEach(([nome,al])=>{ al.split(',').forEach(a=>{ m[a]=nome; }); SLUGS_BO[nome]=(nome==='Jó')?'jó':al.split(',')[0]; });
  return m;
})();
/* Devolve {livro,cap,ini,fim,texto} ou null se não estiver no modelo Livro capítulo:versículo */
function parseRef(ref){
  const t=String(ref||'').trim().replace(/\s+/g,' ');
  const m=t.match(/^(.+?)\s*(\d{1,3})\s*[:.,]\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?$/);
  if(!m) return null;
  const bruto=m[1].trim().toLowerCase();
  const livro = (bruto==='jó') ? 'Jó' : LIVROS_MAP[normLivro(m[1])];
  if(!livro) return null;
  const cap=+m[2], ini=+m[3], fim=m[4]?+m[4]:null;
  if(cap<1 || ini<1 || (fim!==null && fim<=ini)) return null;
  return {livro, cap, ini, fim, texto: livro+' '+cap+':'+ini+(fim?'-'+fim:'')};
}
/* Referência estruturada (livro, capítulo, versículos) mesmo quando o texto digitado não está no modelo exato */
function refEstruturada(ref){
  const t=String(ref||'').trim().replace(/\s+/g,' ');
  let r=parseRef(t);
  if(r) return r;
  let m=t.match(/^(.+?\s*\d{1,3}\s*[:.,]\s*\d{1,3}(?:\s*[-–—]\s*\d{1,3})?)/);
  if(m){ r=parseRef(m[1]); if(r) return r; }
  m=t.match(/^(.+?)\s*(\d{1,3})(?!\d)/);
  if(m){
    const bruto=m[1].trim().toLowerCase();
    const livro=(bruto==='jó')?'Jó':LIVROS_MAP[normLivro(m[1])];
    if(livro) return {livro, cap:+m[2], ini:null, fim:null, texto:livro+' '+m[2]};
  }
  return null;
}
/* ======== Open Bible / texto dos versículos (JSON do repositório thiagobodruk/bible) ======== */
const RAW_JSON='https://raw.githubusercontent.com/thiagobodruk/bible/master/json/';
const VERSOES_PT=[['pt_nvi','NVI — Nova Versão Internacional'],['pt_ntlh','NTLH — Nova Tradução na Linguagem de Hoje'],['pt_acf','ACF — Almeida Corrigida Fiel'],['pt_arc','ARC — Almeida Revista e Corrigida'],['pt_ara','ARA — Almeida Revista e Atualizada'],['pt_aa','AA — Almeida Revisada Imprensa Bíblica'],['pt_avm','AVM — Ave Maria'],['pt_pastoral','Edição Pastoral'],['pt_matos','Pe. Matos Soares']];
let CATALOGO_TENTADO=false;
function catalogoPT(){
  const lista=VERSOES_PT.slice();
  (getCfg().catalogoPT||[]).forEach(([c,n])=>{ if(!lista.some(x=>x[0]===c)) lista.push([c,n]); });
  return lista;
}
function siglaVersao(cod){ return String(cod||'').replace(/^pt_/,'').toUpperCase(); }
/* Lê json/index.json (se possível) para listar também as outras traduções em português */
async function atualizarCatalogoPT(){
  if(CATALOGO_TENTADO) return false;
  CATALOGO_TENTADO=true;
  try{
    const r=await fetch(RAW_JSON+'index.json');
    if(!r.ok) return false;
    const j=JSON.parse((await r.text()).replace(/^\uFEFF/,''));
    const achados=[], vistos=new Set(VERSOES_PT.map(x=>x[0]));
    const ehPT=x=>typeof x==='string' && /^pt_[a-z0-9_]+$/.test(x.replace(/\.json$/,''));
    const add=(cod,nome)=>{
      cod=cod.replace(/\.json$/,'');
      if(vistos.has(cod)) return; vistos.add(cod);
      const sig=siglaVersao(cod);
      achados.push([cod, nome ? (nome.toUpperCase().includes(sig)?nome:sig+' — '+nome) : sig]);
    };
    const nomeDe=o=>{ for(const k of ['name','title','label','nome']) if(typeof o[k]==='string') return o[k]; return null; };
    const visita=o=>{
      if(Array.isArray(o)){ o.forEach(visita); return; }
      if(!o || typeof o!=='object') return;
      for(const k of ['code','id','file','version','key']){ if(ehPT(o[k])){ add(o[k], nomeDe(o)); break; } }
      Object.keys(o).forEach(k=>{
        if(ehPT(k)){ const v=o[k]; add(k, typeof v==='string' ? v : (v && typeof v==='object' ? nomeDe(v) : null)); }
        if(o[k] && typeof o[k]==='object') visita(o[k]);
      });
    };
    visita(j);
    if(!achados.length) return false;
    achados.sort((a,b)=>a[1].localeCompare(b[1],'pt'));
    const c=getCfg(), antes=(c.catalogoPT||[]).length;
    c.catalogoPT=achados; setCfg(c);
    return achados.length!==antes;
  }catch(err){ return false; }
}
function abrevOB(livro){
  const i=indiceLivro(livro), c=(getCfg().abrevJSON||[])[i];
  if(c) return c;
  return livro==='Jó' ? 'job' : (livro==='Atos' ? 'atos' : SLUGS_BO[livro]);
}

/* Cache dos arquivos JSON: memória + IndexedDB (para funcionar sem internet depois do primeiro uso) */
const BIBLIAS_MEM={}, BIBLIAS_PROM={};
function idbAbrir(){
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('ep_biblias',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('b');
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); }
  });
}
async function idbOp(modo, fn){
  try{
    const db=await idbAbrir();
    return await new Promise((res,rej)=>{
      const q=fn(db.transaction('b',modo).objectStore('b'));
      q.onsuccess=()=>res(q.result===undefined?null:q.result); q.onerror=()=>rej(q.error);
    });
  }catch(e){ return null; }
}
const idbGet=k=>idbOp('readonly', st=>st.get(k));
const idbSet=(k,v)=>idbOp('readwrite', st=>st.put(v,k));
const idbDel=k=>idbOp('readwrite', st=>st.delete(k));
const idbTem=async k=>(await idbOp('readonly', st=>st.getKey(k)))!==null;
function registrarAbrevs(data){
  /* Guarda as abreviações reais do arquivo (links do Open Bible) e as aceita como apelidos de livro */
  const abrevs=data.map(b=>b && typeof b.abbrev==='string' ? b.abbrev : '');
  if(abrevs.length!==66 || abrevs.some(a=>!a)) return;
  abrevs.forEach((a,i)=>{ const k=normLivro(a); if(k && !LIVROS_MAP[k]) LIVROS_MAP[k]=LIVROS_LISTA[i]; });
  const c=getCfg();
  if(JSON.stringify(c.abrevJSON||[])!==JSON.stringify(abrevs)){ c.abrevJSON=abrevs; setCfg(c); }
}
function carregarBiblia(cod){
  if(BIBLIAS_MEM[cod]) return Promise.resolve(BIBLIAS_MEM[cod]);
  if(BIBLIAS_PROM[cod]) return BIBLIAS_PROM[cod];
  BIBLIAS_PROM[cod]=(async()=>{
    try{
      let data=await idbGet('bible:'+cod);
      if(!Array.isArray(data)){
        const r=await fetch(RAW_JSON+cod+'.json');
        if(!r.ok) throw new Error('Não foi possível baixar esta versão ('+r.status+').');
        data=JSON.parse((await r.text()).replace(/^\uFEFF/,''));
        if(!Array.isArray(data) || data.length<60) throw new Error('Arquivo da versão em formato inesperado.');
        idbSet('bible:'+cod, data);
      }
      BIBLIAS_MEM[cod]=data;
      registrarAbrevs(data);
      return data;
    } finally { delete BIBLIAS_PROM[cod]; }
  })();
  return BIBLIAS_PROM[cod];
}
/* Devolve [{n,t}] com os versículos da referência, ou null se não existir nessa versão */
async function textoVersiculo(r, cod){
  const data=await carregarBiblia(cod);
  const livro=data[indiceLivro(r.livro)];
  const cap=livro && Array.isArray(livro.chapters) ? livro.chapters[r.cap-1] : null;
  if(!Array.isArray(cap) || !r.ini) return null;
  const vs=[];
  for(let n=r.ini; n<=(r.fim||r.ini); n++){ if(typeof cap[n-1]==='string') vs.push({n, t:cap[n-1].trim()}); }
  return vs.length ? vs : null;
}
function versHtml(vs){
  return vs.length===1 ? escapeHtml(vs[0].t) : vs.map(v=>'<sup>'+v.n+'</sup> '+escapeHtml(v.t)).join(' ');
}
function modoTexto(){ const m=getCfg().textoModo; return (m==='inline'||m==='off') ? m : 'popup'; }
function versaoTexto(){ const v=getCfg().textoVersao; return catalogoPT().some(x=>x[0]===v) ? v : 'pt_nvi'; }
function opcoesVersaoTexto(){
  const ef=versaoTexto();
  return catalogoPT().map(([c,n])=>`<option value="${c}" ${ef===c?'selected':''}>${n}</option>`).join('');
}

/* Reconhece "Livro 3:16" e "Liv 3:16-18" dentro de textos livres */
const REF_RE=/((?:[1-3]\s?[ºo°]?\s?)?[A-Za-zÀ-ÿ]+(?:\s+(?:de|do|da|dos|das)\s+[A-Za-zÀ-ÿ]+)?)\.?\s*(\d{1,3})\s*:\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?/g;
function textoComRefs(txt){
  const s=String(txt||''), modo=modoTexto();
  if(modo==='off') return escapeHtml(s);
  let out='', ultimo=0;
  for(const m of s.matchAll(REF_RE)){
    let ini=m.index, trecho=m[0], r=parseRef(trecho);
    if(!r){
      /* "Livros de Jo 3:16": tenta sem as primeiras palavras */
      const pal=trecho.split(/\s+/);
      for(let k=1;k<=Math.min(3,pal.length-1) && !r;k++){
        const cand=pal.slice(k).join(' ');
        const r2=parseRef(cand);
        if(r2){ r=r2; ini=m.index+trecho.length-cand.length; trecho=cand; }
      }
    }
    if(!r || !r.ini) continue;
    out+=escapeHtml(s.slice(ultimo,ini));
    out+='<span class="ref" role="button" tabindex="0" data-ref="'+escapeAttr(r.texto)+'">'+escapeHtml(trecho)+'</span>';
    if(modo==='inline') out+=' <span class="ref-inline" data-ref-inline="'+escapeAttr(r.texto)+'">…</span>';
    ultimo=ini+trecho.length;
  }
  return out+escapeHtml(s.slice(ultimo));
}
/* Bloco com o texto do versículo logo abaixo do texto-base / versículo de apoio */
function blocoVerso(ref){
  if(modoTexto()==='off') return '';
  const r=refEstruturada(ref);
  if(!r || !r.ini) return '';
  return '<div class="m-vtexto" data-ref-block="'+escapeAttr(r.texto)+'">Carregando versículo…</div>';
}
async function hidratarVersiculos(raiz){
  if(!raiz || modoTexto()==='off') return;
  const els=[...raiz.querySelectorAll('[data-ref-block],[data-ref-inline]')];
  if(!els.length) return;
  const cod=versaoTexto(), sig=siglaVersao(cod);
  const bloco=el=>el.hasAttribute('data-ref-block');
  try{ await carregarBiblia(cod); }
  catch(err){
    els.forEach(el=>{ el.innerHTML = bloco(el) ? '<span class="m-vfalha">Texto do versículo indisponível (sem internet?). Em Configurações você pode baixar a versão para usar offline.</span>' : ''; });
    return;
  }
  for(const el of els){
    const r=parseRef(el.getAttribute('data-ref-block')||el.getAttribute('data-ref-inline'));
    const vs=r ? await textoVersiculo(r,cod) : null;
    if(!vs){ el.innerHTML = bloco(el) ? '<span class="m-vfalha">Versículo não encontrado nesta versão.</span>' : ''; continue; }
    el.innerHTML = bloco(el) ? versHtml(vs)+' <span class="m-vsig">'+sig+'</span>' : '“'+versHtml(vs)+'”';
  }
}
let VP_TOKEN=0;
function abrirPopupVerso(refTexto){
  const r=parseRef(refTexto); if(!r) return;
  const cod=versaoTexto();
  let el=document.getElementById('verse-pop');
  if(!el){ el=document.createElement('div'); el.id='verse-pop'; el.className='verse-pop no-print'; document.body.appendChild(el); }
  const meu=++VP_TOKEN;
  el.innerHTML='<div class="vp-head"><strong>'+escapeHtml(r.texto)+'</strong><span class="vp-ver">'+siglaVersao(cod)+'</span><button type="button" class="vp-x" aria-label="Fechar">✕</button></div><div class="vp-body">Carregando…</div>';
  el.querySelector('.vp-x').addEventListener('click', ()=>el.remove());
  const corpo=el.querySelector('.vp-body');
  textoVersiculo(r,cod)
    .then(vs=>{ if(meu===VP_TOKEN) corpo.innerHTML = vs ? versHtml(vs) : 'Versículo não encontrado nesta versão.'; })
    .catch(()=>{ if(meu===VP_TOKEN) corpo.textContent='Não foi possível carregar o texto. Verifique a internet ou baixe a versão em Configurações.'; });
}
function bindPreviasVerso(){
  if(modoTexto()==='off') return;
  document.querySelectorAll('#ed-base, .ponto-versiculo').forEach(inp=>{
    const campo=inp.closest('.field'), prev=campo && campo.querySelector('.vprev');
    if(!prev) return;
    let timer;
    const atualizar=()=>{
      clearTimeout(timer);
      timer=setTimeout(async()=>{
        const r=refEstruturada(inp.value);
        if(!r || !r.ini){ prev.innerHTML=''; return; }
        const meu=(inp._tok=(inp._tok||0)+1);
        prev.textContent='Carregando…';
        try{
          const cod=versaoTexto(), vs=await textoVersiculo(r,cod);
          if(meu!==inp._tok) return;
          prev.innerHTML = vs ? '<strong>'+escapeHtml(r.texto)+' ('+siglaVersao(cod)+')</strong> '+versHtml(vs) : 'Versículo não encontrado nesta versão.';
        }catch(err){ if(meu===inp._tok) prev.textContent='Texto indisponível (sem internet?).'; }
      },400);
    };
    inp.addEventListener('input',atualizar);
    atualizar();
  });
}
async function atualizarStatusTexto(){
  const el=document.getElementById('texto-status'); if(!el) return;
  const tem=await idbTem('bible:'+versaoTexto());

}

/* Texto enviado à busca: padronizado como "Livro capítulo:versículo" quando possível; senão, vai como foi digitado */
function refParaBusca(ref){
  const t=String(ref||'').trim();
  const r=parseRef(t);
  if(r) return r.texto;
  const m=t.match(/^(.+?\s*\d{1,3}\s*[:.,]\s*\d{1,3}(?:\s*[-–—]\s*\d{1,3})?)/);
  if(m){ const r2=parseRef(m[1]); if(r2) return r2.texto; }
  return t;
}
function linkVerso(ref){
  if(!ref||!ref.trim()) return '';
  return '<a class="verse" href="'+escapeAttr(bibleUrl(refParaBusca(ref)))+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(ref.trim())+'</a>';
}
function abrirVersiculo(ref){
  ref=(ref||'').trim();
  if(!ref){ alert('Preencha o versículo primeiro.'); return; }
  window.open(bibleUrl(refParaBusca(ref)),'_blank','noopener');
}
function fmtDataCurta(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function fmtDataHora(iso){ const dt=new Date(iso); return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

function pageContent(){
  switch(state.tab){
    case 'lista': return viewLista();
    case 'editor': return viewEditor();
    case 'config': return viewConfig();
    default: return '';
  }
}
function bindApp(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click', ()=>{
    if(b.dataset.tab==='editor' && !state.editor){ state.editor=esbocoVazio(); }
    state.tab=b.dataset.tab; state.modal=null; render();
  }));
  bindPage();
}

/* ============ LISTA ============ */
function viewLista(){
  const busca = state.busca.toLowerCase();
  const esbocos = DB.getEsbocos()
    .filter(e=> e.titulo.toLowerCase().includes(busca) || (e.tema||'').toLowerCase().includes(busca) || (e.textoBase||'').toLowerCase().includes(busca))
    .sort((a,b)=> (b.data||'').localeCompare(a.data||'') || (b.criadoEm||'').localeCompare(a.criadoEm||''));
  return `
    <div class="page-head"><div><h2>Esboços</h2><div class="sub">Seus esboços de pregação salvos</div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn secondary small" id="btn-importar-lista">📥 Importar</button><button class="btn secondary small" id="btn-ia">🤖 Buscar com IA</button><button class="btn small" id="btn-novo">+ Novo esboço</button></div>
    </div>
    <div class="toolbar"><div class="search-box"><input type="text" id="busca" placeholder="Buscar por título, tema ou texto-base..." value="${state.busca}"></div></div>
    ${esbocos.length===0?`<div class="card"><div class="empty">Nenhum esboço encontrado. Crie o primeiro em "Novo esboço".</div></div>`:
      esbocos.map(e=>`
      <div class="esboco-card">
        <h3>${e.titulo||'(sem título)'}</h3>
        <div class="meta">
          ${e.data?`<span>📅 ${fmtDataCurta(e.data)}</span>`:''}
          ${e.textoBase?`<span>📖 ${linkVerso(e.textoBase)}</span>`:''}
          ${e.tema?`<span class="badge">${e.tema}</span>`:''}
          <span>${e.pontos.filter(p=>p.titulo||p.texto).length} ponto(s)</span>
        </div>
        <div class="row-actions">
          <button class="btn secondary small" data-editar="${e.id}">Editar</button>
          <button class="btn ghost small" data-visualizar="${e.id}">Visualizar / Imprimir</button>
          <button class="btn ghost small" data-duplicar="${e.id}">Duplicar</button>
          <button class="btn ghost small" data-compartilhar="${e.id}">Compartilhar</button>
          <button class="btn danger small" data-excluir="${e.id}">Excluir</button>
        </div>
      </div>`).join('')}
  `;
}

/* ============ EDITOR ============ */

    ${state.editorErro?`<div class="error-msg">${state.editorErro}</div>`:''}
    <form id="form-editor">
      <div class="card">
        <div class="field"><label>Título da pregação</label><input type="text" id="ed-titulo" required value="${e.titulo||''}" placeholder="Ex: A fé que vence o mundo"></div>

/* ============ EVENTOS POR PÁGINA ============ */
function bindPage(){
  if(state.tab==='lista'){
    document.getElementById('btn-novo').addEventListener('click', ()=>{ state.editor=esbocoVazio(); state.editorErro=''; state.tab='editor'; render(); });
    document.getElementById('btn-ia').addEventListener('click', ()=>abrirIA(false));
    const busca=document.getElementById('busca');
    busca.addEventListener('input', e=>{ state.busca=e.target.value; render(); const i=document.getElementById('busca'); i.focus(); i.selectionStart=i.value.length; });
    document.querySelectorAll('[data-editar]').forEach(b=>b.addEventListener('click', ()=>{
      const esb = DB.getEsbocos().find(x=>x.id===b.dataset.editar);
      state.editor = JSON.parse(JSON.stringify(esb)); state.editor.links = state.editor.links||[];
      state.editorErro=''; state.tab='editor'; render();
    }));
    document.querySelectorAll('[data-visualizar]').forEach(b=>b.addEventListener('click', ()=>{
      const esb = DB.getEsbocos().find(x=>x.id===b.dataset.visualizar);
      state.modal={type:'visualizar', payload:esb}; render();
    }));
    document.querySelectorAll('[data-duplicar]').forEach(b=>b.addEventListener('click', ()=>{
      const esb = DB.getEsbocos().find(x=>x.id===b.dataset.duplicar);
      const copia = JSON.parse(JSON.stringify(esb));
      copia.id=uid(); copia.titulo = copia.titulo + ' (cópia)'; copia.criadoEm=new Date().toISOString(); copia.atualizadoEm=copia.criadoEm;
      copia.pontos.forEach(p=>p.id=uid());
      const lista = DB.getEsbocos(); lista.push(copia); DB.setEsbocos(lista);
      render();
    }));
    document.querySelectorAll('[data-compartilhar]').forEach(b=>b.addEventListener('click', ()=>{
      const esb = DB.getEsbocos().find(x=>x.id===b.dataset.compartilhar);
      if(esb) compartilharEsbocos([esb], 'esboco-'+slugArquivo(esb.titulo)+'.json', esb.titulo||'Esboço');
    }));
    document.getElementById('btn-importar-lista').addEventListener('click', ()=>{
      const i=document.createElement('input'); i.type='file'; i.accept='.json,.txt,application/json,text/plain';
      i.addEventListener('change', importarDados); i.click();
    });
    document.querySelectorAll('[data-excluir]').forEach(b=>b.addEventListener('click', ()=>{
      if(confirm('Excluir este esboço? Essa ação não pode ser desfeita.')){
        DB.setEsbocos(DB.getEsbocos().filter(x=>x.id!==b.dataset.excluir)); render();
      }
    }));
  }
  if(state.tab==='editor'){
    document.getElementById('btn-add-ponto').addEventListener('click', ()=>{
      sincronizarEditorComDOM();
      state.editor.pontos.push({id:uid(), titulo:'', versiculo:'', texto:'', aplicacao:'', pergAntes:'', pergDepois1:'', pergDepois2:''});
      render();
    });
    document.querySelectorAll('[data-remover-ponto]').forEach(b=>b.addEventListener('click', ()=>{
      sincronizarEditorComDOM();
      state.editor.pontos = state.editor.pontos.filter(p=>p.id!==b.dataset.removerPonto);
      render();
    }));
    document.getElementById('btn-ia-editor').addEventListener('click', ()=>{ sincronizarEditorComDOM(); abrirIA(true); });
    document.getElementById('btn-cores-editor').addEventListener('click', ()=>abrirPainelEstilos(Object.keys(ESTILOS),'Cores e estilo do texto'));
    document.querySelectorAll('.est-atalho').forEach(b=>b.addEventListener('click', ()=>abrirPainelEstilos(b.dataset.estiloChaves.split(','),'Cores deste trecho')));
    document.querySelectorAll('[data-abrir-verso]').forEach(b=>b.addEventListener('click', ()=>abrirVersiculo(b.previousElementSibling.value)));
    bindPreviasVerso();
    document.querySelectorAll('[data-abrir-link]').forEach(b=>b.addEventListener('click', ()=>{ const u=normalizeUrl(b.previousElementSibling.value); if(u) window.open(u,'_blank','noopener'); }));
    document.getElementById('btn-add-link').addEventListener('click', ()=>{ sincronizarEditorComDOM(); state.editor.links.push({id:uid(), titulo:'', url:''}); render(); });
    document.querySelectorAll('[data-remover-link]').forEach(b=>b.addEventListener('click', ()=>{ sincronizarEditorComDOM(); state.editor.links = state.editor.links.filter(l=>l.id!==b.dataset.removerLink); render(); }));
    document.getElementById('btn-cancelar-editor').addEventListener('click', ()=>{
      state.editor=null; state.editorErro=''; state.tab='lista'; render();
    });
    document.getElementById('form-editor').addEventListener('submit', e=>{
      e.preventDefault();
      sincronizarEditorComDOM();
      const ed = state.editor;
      if(!ed.titulo || !ed.titulo.trim()){ state.editorErro='Preencha o título da pregação.'; render(); return; }
      ed.links = (ed.links||[]).filter(l=>l.url && l.url.trim()).map(l=>({...l, url:normalizeUrl(l.url)}));
      let lista = DB.getEsbocos();
      if(ed.id){
        ed.atualizadoEm=new Date().toISOString();
        lista = lista.map(x=>x.id===ed.id?ed:x);
      }else{
        ed.id=uid(); ed.criadoEm=new Date().toISOString(); ed.atualizadoEm=ed.criadoEm;
        lista.push(ed);
      }
      DB.setEsbocos(lista);
      state.editor=null; state.editorErro=''; state.tab='lista';
      render();
    });

function montarPromptIA(pedido, comoJSON){
  let t = 'Crie um esboço de pregação cristã em português do Brasil sobre: '+pedido+'.\nInclua: título, tema, texto-base (referência bíblica), resumo do conteúdo (2 a 3 frases), introdução, 3 a 4 pontos principais (cada um com título, versículo de apoio, desenvolvimento, aplicação prática do ponto, uma pergunta para depois do versículo de apoio e duas perguntas para depois da aplicação prática) e conclusão. Escreva TODAS as referências bíblicas apenas no formato "Livro capítulo:versículo" (exemplo: João 3:16 ou Mateus 18:21-35), sem listas de versículos separados por vírgula.';
  if(comoJSON){
    t += '\nResponda SOMENTE com JSON válido, sem markdown nem texto extra, neste formato exato:\n{"titulo":"","tema":"","textoBase":"","resumo":"","introducao":"","pontos":[{"titulo":"","versiculo":"","texto":"","aplicacao":"","pergAntes":"","pergDepois1":"","pergDepois2":""}],"conclusao":""}';
  }
  return t;
}
async function gerarComIA(){
  const cfg=getCfg();
  if(!state.iaPedido.trim()){ state.iaErro='Descreva o tema ou a passagem primeiro.'; render(); return; }
  const rascunho = state.editor && (state.editor.titulo||state.editor.introducao||state.editor.conclusao);
  if(rascunho && !confirm('O rascunho aberto no editor será substituído pelo esboço gerado. Continuar?')) return;
  state.iaLoading=true; state.iaErro=''; render();
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'content-type':'application/json',
        'x-api-key':cfg.apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({model:MODELO_IA, max_tokens:4000, messages:[{role:'user', content:montarPromptIA(state.iaPedido,true)}]})
    });
    if(!resp.ok){
      let msg='Erro '+resp.status;
      try{ const j=await resp.json(); if(j.error&&j.error.message) msg+=': '+j.error.message; }catch(_){}
      throw new Error(msg);
    }
    const data = await resp.json();
    const texto = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const i=texto.indexOf('{'), j=texto.lastIndexOf('}');
    if(i<0 || j<=i) throw new Error('Resposta da IA em formato inesperado. Tente de novo.');
    const r = JSON.parse(texto.slice(i,j+1));
    const base = (state.iaFromEditor && state.editor) ? state.editor : esbocoVazio();
    base.titulo = String(r.titulo||'');
    base.tema = String(r.tema||'');
    base.textoBase = String(r.textoBase||'');
    base.resumo = String(r.resumo||'');
    base.introducao = String(r.introducao||'');
    base.conclusao = String(r.conclusao||'');
    base.aplicacao = String(r.aplicacao||'');
    base.pontos = (Array.isArray(r.pontos)?r.pontos:[]).map(p=>({id:uid(), titulo:String(p.titulo||''), versiculo:String(p.versiculo||''), texto:String(p.texto||''), aplicacao:String(p.aplicacao||''), pergAntes:String(p.pergAntes||''), pergDepois1:String(p.pergDepois1||''), pergDepois2:String(p.pergDepois2||'')}));
    if(base.pontos.length===0) base.pontos.push({id:uid(), titulo:'', versiculo:'', texto:'', aplicacao:'', pergAntes:'', pergDepois1:'', pergDepois2:''});
    base.links = base.links||[];
    state.editor = base; state.editorErro='';
    state.iaLoading=false; state.modal=null; state.tab='editor';
    render();
  }catch(err){
    state.iaLoading=false;
    state.iaErro = (err instanceof TypeError) ? 'Sem conexão com a internet, ou o navegador bloqueou o pedido.' : err.message;
    render();
  }
}

/* ============ BACKUP ============ */
function slugArquivo(t){
  const x=String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  return x||'sem-titulo';
}
function criarArquivoBackup(lista, nome, tipo){
  const backup = { tipo:'esboco-pregacao-backup', versao:1, exportadoEm:new Date().toISOString(), esbocos: lista };
  return new File([JSON.stringify(backup,null,2)], nome, {type: tipo||'application/json'});
}
function baixarArquivo(file){
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href=url; a.download=file.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
/* Abre o menu "compartilhar" do aparelho (WhatsApp, e-mail, Drive...); sem suporte, baixa o arquivo.
   O Chrome/Android só deixa compartilhar arquivos de tipos permitidos (texto, imagem, PDF...), por isso o
   backup vai como ".txt" (o conteúdo continua sendo o mesmo JSON e o app importa normalmente). */
async function compartilharEsbocos(lista, nome, titulo){
  if(!lista.length){ alert('Não há esboços para compartilhar.'); return; }
  const arquivoTxt = criarArquivoBackup(lista, nome.replace(/\.json$/i,'.txt'), 'text/plain');
  let motivo='';
  if(!navigator.share) motivo='O navegador não oferece o menu de compartilhar. Isso acontece quando o aplicativo é aberto como arquivo do aparelho (e não por um endereço https://) ou em navegadores sem esse recurso.';
  else if(!navigator.canShare) motivo='Este navegador não permite compartilhar arquivos.';
  else if(!navigator.canShare({files:[arquivoTxt]})) motivo='O navegador recusou compartilhar este tipo de arquivo.';
  else{
    try{ await navigator.share({files:[arquivoTxt], title:titulo}); return; }
    catch(err){
      if(err && err.name==='AbortError') return;
      motivo='O navegador não conseguiu abrir o menu de compartilhar ('+((err&&err.name)||'erro')+(err&&err.message?': '+err.message:'')+').';
    }
  }
  baixarArquivo(criarArquivoBackup(lista, nome));
  alert(motivo+'\n\nBaixei o arquivo no aparelho: envie-o por WhatsApp, e-mail ou pendrive e use "Importar" no outro aparelho.');
}
function exportarDados(){
  baixarArquivo(criarArquivoBackup(DB.getEsbocos(), 'backup-esbocos-pregacao-'+new Date().toISOString().slice(0,10)+'.json'));
}
/* Mescla esboços recebidos com os locais, sem apagar nada */
function mesclarEsbocos(local, entrada){
  const quando = x => x.atualizadoEm || x.criadoEm || '';
  const lista = local.slice();
  const r = {novos:0, atualizados:0, mantidos:0, iguais:0, copias:0};
  entrada.forEach(inc=>{
    if(!inc || typeof inc!=='object') return;
    if(!inc.id) inc.id=uid();
    if(!Array.isArray(inc.pontos)) inc.pontos=[];
    const i = lista.findIndex(x=>x.id===inc.id);
    if(i<0){ lista.push(inc); r.novos++; return; }
    const atual = lista[i];
    if(JSON.stringify(atual)===JSON.stringify(inc)){ r.iguais++; return; }
    const ta=quando(atual), ti=quando(inc);
    if(ti && ta && ti>ta){ lista[i]=inc; r.atualizados++; }
    else if(ti && ta && ti<ta){ r.mantidos++; }
    else{
      /* mesma data (ou sem data) mas conteúdo diferente: guarda as duas versões */
      inc.id=uid(); inc.titulo=(inc.titulo||'')+' (importado)';
      inc.pontos.forEach(p=>p.id=uid());
      lista.push(inc); r.copias++;
    }
  });
  return {lista, ...r};
}
function importarDados(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let backup;
    try{ backup = JSON.parse(reader.result); }
    catch(err){ alert('Arquivo inválido. Selecione um arquivo gerado por este aplicativo.'); e.target.value=''; return; }
    if(!backup || !Array.isArray(backup.esbocos)){ alert('Arquivo inválido ou incompleto. Nenhum dado foi alterado.'); e.target.value=''; return; }
    const n = backup.esbocos.length;
    if(!confirm('O arquivo tem '+n+(n===1?' esboço':' esboços')+'. Eles serão MESCLADOS com os seus: nada será apagado e, se o mesmo esboço existir nos dois lados, fica o mais recente. Continuar?')){ e.target.value=''; return; }
    const m = mesclarEsbocos(DB.getEsbocos(), backup.esbocos);
    DB.setEsbocos(m.lista);
    const partes=[];
    if(m.novos) partes.push(m.novos+(m.novos===1?' novo':' novos'));
    if(m.atualizados) partes.push(m.atualizados+(m.atualizados===1?' atualizado':' atualizados'));
    if(m.copias) partes.push(m.copias+(m.copias===1?' mantido como cópia (marcado "importado")':' mantidos como cópia (marcados "importado")'));
    if(m.mantidos) partes.push(m.mantidos+(m.mantidos===1?' ignorado (o seu é mais recente)':' ignorados (os seus são mais recentes)'));
    if(m.iguais) partes.push(m.iguais+(m.iguais===1?' já existia igual':' já existiam iguais'));
    alert('Importação concluída.\n'+(partes.length?partes.join('\n'):'Nenhuma alteração.'));
    e.target.value='';
    state.tab='lista'; render();
  };
  reader.readAsText(file);
}
function apagarTudo(){
  if(!confirm('ATENÇÃO: isso vai apagar PERMANENTEMENTE todos os esboços salvos.\n\nOs dados NÃO poderão ser recuperados depois. Deseja continuar?')) return;
  const digitado = prompt('Para confirmar, digite APAGAR (em letras maiúsculas):');
  if(digitado !== 'APAGAR'){ alert('Confirmação incorreta. Nenhum dado foi apagado.'); return; }
  localStorage.removeItem('ep_esbocos');
  state.tab='lista'; state.busca=''; state.editor=null;
  alert('Todos os dados foram apagados.');
  render();
}

  if(ev.key==='Enter' && ev.target.classList && ev.target.classList.contains('ref')){ ev.preventDefault(); abrirPopupVerso(ev.target.dataset.ref); }
  if(ev.key==='Escape'){ const pop=document.getElementById('verse-pop'); if(pop) pop.remove(); }
});
aplicarVisualizacao();
render();
</script>
